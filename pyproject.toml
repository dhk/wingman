[project]
name = "wingman"
version = "0.1.0"
description = "Local-first career intelligence and job-search support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.100",
  "mcp>=1.2",
  "platformdirs>=4.0",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.scripts]
wingman = "wingman.cli.main:app"
wingman-mcp = "wingman.mcp_server:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not evaluation_live'"
markers = [
  "evaluation_live: evaluation tests that call live model providers; excluded from the default suite (see docs/EVALUATION.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
