[project]
name = "wingman"
dynamic = ["version"]
description = "Local-first career intelligence and job-search support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.100",
  "mcp>=1.2,<2",
  "platformdirs>=4.0",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "typer>=0.12",
]

[project.scripts]
wingman = "wingman.cli.main:run"
wingman-mcp = "wingman.mcp_server:main"
wingman-upgrade-all = "wingman.infrastructure.upgrade_all:main"
wingman-host-status = "wingman.infrastructure.host_status:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  # Held below 0.16 deliberately: that release adds and changes rules
  # (B008, SIM117, UP037, ISC004, RUF100...) which flag ~151 pre-existing
  # findings across this codebase. Adopting a new linter is a code change,
  # not a dependency refresh, and mixing the two makes both unreviewable.
  "ruff>=0.6,<0.16",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not evaluation_live'"
markers = [
  "evaluation_live: evaluation tests that call live model providers; excluded from the default suite (see docs/EVALUATION.md)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
