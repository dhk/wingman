name: Agent loop verdict
description: Validate a reviewer's raw answer into the agent loop's verdict shape (docs/AGENT-LOOP.md).
inputs:
  raw-file:
    description: File holding the reviewer's raw answer
    required: true
outputs:
  valid:
    description: "'true' when the answer is a usable verdict"
    value: ${{ steps.validate.outputs.valid }}
  review:
    description: Normalized verdict JSON (only when valid)
    value: ${{ steps.validate.outputs.review }}
runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      run: python3 -I "$GITHUB_ACTION_PATH/validate.py" "$RAW_FILE"
      env:
        RAW_FILE: ${{ inputs.raw-file }}
