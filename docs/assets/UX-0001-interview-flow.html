n\n  <!-- 07 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">07 — Question inventory<\u002Fx-import>\n\n  <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted); max-width: 700px; margin-bottom: 20px;\">Every question in the flow, and its control type. The rule that generates this table: <strong style=\"color: var(--text);\">if the answer is stored as evidence, it is free text<\u002Fstrong>.<\u002Fp>\n\n  <div style=\"border: 1px solid var(--border); border-radius: 4px; overflow: hidden;\">\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); background: var(--bg2); border-bottom: 1px solid var(--border);\">\n      <span style=\"padding: 10px 12px;\">Question<\u002Fspan><span style=\"padding: 10px 12px;\">Control<\u002Fspan><span style=\"padding: 10px 12px;\">Options<\u002Fspan><span style=\"padding: 10px 12px;\">Stored as<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Where to start<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Single select<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">4 modules + resume + Other<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">—<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Source to react to<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Free text<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">\"nothing comes to mind\", \"done\"<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">context<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Agree or disagree<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Single select<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">Agree · Disagree · it's complicated<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">subtype<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Nominees (×3)<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Free text ×3<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">fallback switch · skip block<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">context<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Understood purpose<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Free text<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">\"not sure\" is acceptable, stored as-is<\u002Fspan><span style=\"padding: 11px 12px; color: var(--accent-purple);\">context<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--tint-essay);\">\n      <span style=\"padding: 11px 12px; color: var(--text); font-weight: 500;\">Why, in your own words<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text);\">Free text only<\u002Fspan><span style=\"padding: 11px 12px; color: var(--accent);\">none — not even examples<\u002Fspan><span style=\"padding: 11px 12px; color: var(--accent); font-weight: 500;\">evidence<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; border-bottom: 1px solid var(--border-light); align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Confirm before save<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Single select<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">Save · reword · discard<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">—<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: 1.4fr 1fr 1.6fr 0.9fr; font-size: 13px; align-items: center; background: var(--bg);\">\n      <span style=\"padding: 11px 12px; color: var(--text);\">Another, or stop<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-muted);\">Single select<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">Next · switch module · done<\u002Fspan><span style=\"padding: 11px 12px; color: var(--text-dim);\">—<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 08 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">08 — The four open questions, resolved<\u002Fx-import>\n\n  <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n    <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); padding: 20px;\">\n      <div style=\"display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px;\">\n        <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">Q1<\u002Fspan>\n        <div style=\"font-size: 17px; font-weight: 600;\">Batch review before commit?<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted);\"><strong style=\"color: var(--text);\">No — keep commit-on-answer, add a per-capture echo.<\u002Fstrong> A batch commit invents a transaction the storage layer doesn't have, and supersession (RFC-028) already makes re-answering clean. What's actually missing is not deferral but <em>sight of the exact string<\u002Fem>: the echo-and-confirm in §05 buys the protection at one turn's cost. Close each section with a read-only recap and a \"change one of these\" re-ask — review without a pending state.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); padding: 20px;\">\n      <div style=\"display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px;\">\n        <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">Q2<\u002Fspan>\n        <div style=\"font-size: 17px; font-weight: 600;\">How to surface the trust ladder?<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted);\"><strong style=\"color: var(--text);\">As one card, with the ladder expressed as option order.<\u002Fstrong> The recommended step is first and carries a \"suggested first step\" description; \"pick up where I left off\" is promoted to first whenever prior captures exist. No option is ever disabled and no tier is named in the UI — \"Tier 2\" is vocabulary for the design doc, not for the user. Each option carries a rough time cost, which does more to sequence behaviour than any ladder metaphor.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); padding: 20px;\">\n      <div style=\"display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px;\">\n        <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">Q3<\u002Fspan>\n        <div style=\"font-size: 17px; font-weight: 600;\">Show limits proactively?<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted);\"><strong style=\"color: var(--text);\">Yes, in the explainer — but only once they matter.<\u002Fstrong> Suppress below half the cap (\"0 of 6\" is noise that makes a quota feel like a chore); show from the halfway point (\"you've used 4 of 6 slots here\"); at the cap the question never renders at all — the section opens as a recap plus \"replace one of these?\", since supersession means a re-answer is the real affordance. A cap should never first appear as an error.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); padding: 20px;\">\n      <div style=\"display: flex; gap: 12px; align-items: baseline; margin-bottom: 10px;\">\n        <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">Q4<\u002Fspan>\n        <div style=\"font-size: 17px; font-weight: 600;\">Build the anchor-first fallback?<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted);\"><strong style=\"color: var(--text);\">Yes — but as a re-ask inside the section, not a module.<\u002Fstrong> It is one extra question fired on an empty answer: \"an organisation you've actually been part of — school, employer, club, team\". It costs a branch in the tool's return, and without it \"I can't think of one\" dead-ends the whole category. One re-ask only, then the honest stop in §06 (BP-08). Generalise the same shape to Tier 1's \"nothing comes to mind\" — the anchor there is the last thing you sent someone.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 09 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">09 — Copy rules<\u002Fx-import>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; overflow: hidden;\">\n    <div style=\"background: var(--bg); padding: 14px 18px;\"><div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-teal);\">Say<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px;\"><div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-orange);\">Never say<\u002Fdiv><\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-muted);\">\"Your \"why\" is the only part stored.\"<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-dim);\">\"I'll capture your take on this article.\" — blurs stimulus into stance.<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-muted);\">\"Saving this, verbatim: …\"<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-dim);\">\"So what you're saying is…\" — a paraphrase that becomes evidence.<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-muted);\">\"That's a real answer, not a failure.\"<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-dim);\">\"Try harder — just one more.\" — coercion produces junk evidence.<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-muted);\">\"Doing the hard list first is deliberate.\"<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-dim);\">\"Tier 2 of 3 · step 4 of 9\" — wizard chrome the flow doesn't have.<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-muted);\">\"You can stop any time; nothing is lost.\"<\u002Fdiv>\n    <div style=\"background: var(--bg); padding: 14px 18px; font-size: 14px; line-height: 1.65; color: var(--text-dim);\">\"Complete your profile to continue.\" — nothing gates anything.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showRationale }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"border-left: 3px solid var(--accent-orange); background: var(--bg2); border-radius: 0 4px 4px 0; padding: 14px 18px; margin-top: 16px;\">\n    <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\"><strong style=\"color: var(--text);\">The one failure mode worth naming:<\u002Fstrong> a helpful model tidying a user's sentence before passing it to <span style=\"font-family: var(--font-mono); font-size: 13px;\">interview_react<\u002Fspan>. It reads as service and it silently destroys the property the whole system is built on. The echo card exists for this, and it should be the last thing removed if the flow is ever trimmed.<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- 10 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">10 — Tool contract<\u002Fx-import>\n\n  <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted); max-width: 700px; margin-bottom: 20px;\">The implementation surface. Docstrings still carry the <em>how<\u002Fem> (this codebase's existing enforcement mechanism — <span style=\"font-family: var(--font-mono); font-size: 13px;\">qa_capture<\u002Fspan>, <span style=\"font-family: var(--font-mono); font-size: 13px;\">resolve_requirement<\u002Fspan>); the return value carries the <em>what<\u002Fem>, so a section's explainer, position, and next question don't depend on the model remembering them.<\u002Fp>\n\n  <pre style=\"background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 18px; overflow-x: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; color: var(--text-muted);\">{\n  <span style=\"color: var(--accent);\">\"section\"<\u002Fspan>:   <span style=\"color: var(--accent-purple);\">\"values_con\"<\u002Fspan>,\n  <span style=\"color: var(--accent);\">\"explainer\"<\u002Fspan>: <span style=\"color: var(--accent-purple);\">\"Values. I'll ask for three people you'd be…\"<\u002Fspan>,   <span style=\"color: var(--text-dim);\">// BP-01, verbatim<\u002Fspan>\n  <span style=\"color: var(--accent);\">\"position\"<\u002Fspan>:  <span style=\"color: var(--accent-purple);\">\"Con 2 of 3 · 4 of 6 slots used\"<\u002Fspan>,               <span style=\"color: var(--text-dim);\">// BP-05, omit if &lt; half<\u002Fspan>\n  <span style=\"color: var(--accent);\">\"ask\"<\u002Fspan>: {\n    <span style=\"color: var(--accent);\">\"header\"<\u002Fspan>:      <span style=\"color: var(--accent-purple);\">\"Reaction\"<\u002Fspan>,\n    <span style=\"color: var(--accent);\">\"question\"<\u002Fspan>:    <span style=\"color: var(--accent-purple);\">\"Why? In your own words.\"<\u002Fspan>,\n    <span style=\"color: var(--accent);\">\"multi\"<\u002Fspan>:       false,\n    <span style=\"color: var(--accent);\">\"evidence\"<\u002Fspan>:    true,      <span style=\"color: var(--text-dim);\">// true ⇒ options MUST be empty (BP-03)<\u002Fspan>\n    <span style=\"color: var(--accent);\">\"options\"<\u002Fspan>:     [],\n    <span style=\"color: var(--accent);\">\"free_text\"<\u002Fspan>:   <span style=\"color: var(--accent-purple);\">\"required\"<\u002Fspan>  <span style=\"color: var(--text-dim);\">// required | offered — never absent (BP-04)<\u002Fspan>\n  },\n  <span style=\"color: var(--accent);\">\"on_answer\"<\u002Fspan>: <span style=\"color: var(--accent-purple);\">\"interview_react\"<\u002Fspan>,\n  <span style=\"color: var(--accent);\">\"echo_before_save\"<\u002Fspan>: true                                    <span style=\"color: var(--text-dim);\">// BP-06<\u002Fspan>\n}<\u002Fpre>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;\">\n    <div style=\"border: 1px solid var(--border); border-radius: 4px; padding: 18px; background: var(--bg2);\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;\">Still stateless<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Position is computed from stored captures on every call, not held in a session. Restarting the conversation mid-flow resumes correctly because there is nothing to resume — the workspace is the state.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px solid var(--border); border-radius: 4px; padding: 18px; background: var(--bg2);\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;\">Degrades to prose<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">A client without structured questions renders <span style=\"font-family: var(--font-mono); font-size: 13px;\">ask<\u002Fspan> as a plain numbered list. Same protocol, worse ergonomics — which is the correct failure direction.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 11 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">11 — Acceptance checks<\u002Fx-import>\n\n  <div style=\"display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;\">\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2); border-bottom: 1px solid var(--border-light);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">01<\u002Fspan><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\">The stored <span style=\"font-family: var(--font-mono); font-size: 13px;\">detail<\u002Fspan> string is byte-identical to what the user typed, across ten captures — no capitalisation, punctuation, or tidying drift.<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2); border-bottom: 1px solid var(--border-light);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">02<\u002Fspan><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\">No question whose answer becomes evidence is ever presented with preset options, in any transcript.<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2); border-bottom: 1px solid var(--border-light);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">03<\u002Fspan><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\">A Values run asks the con block first and nominee #2 first — verified from the capture timestamps, not from the transcript.<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2); border-bottom: 1px solid var(--border-light);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">04<\u002Fspan><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\">Every module is reachable as the first act of a fresh conversation; none reports a prerequisite.<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2); border-bottom: 1px solid var(--border-light);\"><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-right: 16px;\">05<\u002Fspan>A user who answers \"I can't think of anyone\" twice ends with zero captures, no error, and a named next step.<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2); border-bottom: 1px solid var(--border-light);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">06<\u002Fspan><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\">Hitler is refused in <span style=\"font-family: var(--font-mono); font-size: 13px;\">values_con<\u002Fspan> with a re-ask, and accepted in <span style=\"font-family: var(--font-mono); font-size: 13px;\">mission_alignment_con<\u002Fspan> without comment.<\u002Fspan><\u002Fdiv>\n    <div style=\"display: flex; gap: 16px; padding: 16px 18px; background: var(--bg2);\"><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">07<\u002Fspan><span style=\"font-size: 14px; line-height: 1.6; color: var(--text-muted);\">The same script produces the same question sequence in Claude Code and Claude Desktop.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 12 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">12 — Out of scope<\u002Fx-import>\n\n  <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;\">\n    <div style=\"border: 1px dashed var(--border); border-radius: 4px; padding: 18px;\">\n      <div style=\"font-size: 15px; color: var(--text); font-weight: 500;\">Company alignment (v2)<\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-top: 6px;\">Same loop pointed at one target company during a live search. Inherits everything here unchanged.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px dashed var(--border); border-radius: 4px; padding: 18px;\">\n      <div style=\"font-size: 15px; color: var(--text); font-weight: 500;\">Terminal wizard parity<\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-top: 6px;\"><span style=\"font-family: var(--font-mono);\">wingman perspectives<\u002Fspan> stays as-is. It has no harness to ask through; scripting is its job.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border: 1px dashed var(--border); border-radius: 4px; padding: 18px;\">\n      <div style=\"font-size: 15px; color: var(--text); font-weight: 500;\">Synthesis UX<\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 1.6; color: var(--text-dim); margin-top: 6px;\">How captures become a stance is <span style=\"font-family: var(--font-mono);\">build_own_pov<\u002Fspan>'s problem, and its own spec.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--border);\">\n    <span style=\"font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--text-dim);\">Wingman · UX-0001 · {{ revisionLine }}<\u002Fspan>\n    <span style=\"font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--text-dim);\">Evidence before assertion · suggest, never gate<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1040},&quot;specStatus&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Draft&quot;,&quot;In review&quot;,&quot;Accepted&quot;],&quot;default&quot;:&quot;Draft&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Document&quot;},&quot;revision&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;v0.1&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Document&quot;},&quot;showRationale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Document&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      statusLine: this.props.specStatus ?? \"Draft\",\n      revisionLine: this.props.revision ?? \"v0.1\",\n      showRationale: this.props.showRationale ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
