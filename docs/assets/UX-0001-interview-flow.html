document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"93493536-0f6e-4aa2-894b-19ef1197e219\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ============================================================\n   Color tokens — Electric Cobalt palette (light theme, no dark mode)\n   Rule: never hardcode hex in components — always reference a token.\n   Rule: --text-muted must always be visually lighter than --text.\n   ============================================================ */\n:root {\n  /* ── Backgrounds ── */\n  --bg:  #f5f6fa;   /* page background — near-white blue-grey */\n  --bg2: #eceef5;   /* elevated surfaces, input & code backgrounds */\n  --bg3: #e0e3f0;   /* card hover state, inline code bg */\n\n  /* ── Borders ── */\n  --border:       #c8cde0;   /* default borders, dividers */\n  --border-light: #d8dbeb;   /* subtle borders, grid lines */\n\n  /* ── Text ── */\n  --text:       #0d0f1a;   /* headings, strong — darkest */\n  --text-muted: #2a2d42;   /* body copy, descriptions — lighter than --text */\n  --text-dim:   #5a5d78;   /* metadata, dates, labels, inactive nav */\n\n  /* ── Accent (primary) ── */\n  --accent:       #2b50e8;   /* Electric Cobalt — brand, CTA, active nav, links */\n  --accent-hover: #1a3bd4;   /* hover state for accent elements */\n\n  /* ── Accents (secondary) — content-type semantics ── */\n  --accent-purple: #8b2adc;  /* commentary & tool tags, graph/network work */\n  --accent-orange: #e05c2a;  /* trend/time-series, project tags */\n  --accent-teal:   #0ea5b0;  /* data viz, study tags */\n\n  /* ── Data-visualization palette (six-country */\n  --lh-snug:  1.6;    /* @kind font */\n  --lh-body:  1.75;   /* @kind font */\n\n  /* ── Letter spacing ── */\n  --ls-h1:   -0.02em;\n  --ls-h2:   -0.01em;\n  --ls-meta:  0.04em;\n  --ls-tag:   0.08em;\n  --ls-nav:   0.1em;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Spacing scale\n   Use flex/grid with `gap` for all UI spacing — never margin\n   between sibling components.\n   ============================================================ */\n:root {\n  --sp1:  4px;\n  --sp2:  8px;\n  --sp3:  12px;\n  --sp4:  16px;\n  --sp5:  24px;\n  --sp6:  32px;\n  --sp7:  48px;\n  --sp8:  64px;\n  --sp9:  80px;\n  --sp10: 96px;\n  --sp11: 128px;\n\n  /* ── Backward-compat aliases ── */\n  --space-1: var(--sp1);\n  --space-2: var(--sp2);\n  --space-3: var(--sp3);\n  --space-4: var(--sp4);\n  --space-5: var(--sp5);\n  --space-6: var(--sp6);\n  --space-7: var(--sp7);\n  --space-8: var(--sp8);\n  --space-9: var(--sp9);\n  --space-10: var(--sp10);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Layout tokens\n   ============================================================ */\n:root {\n  --max-width:     1200px;   /* .container cap */\n  --prose-width:   680px;    /* long-form body cap */\n  --header-height: 56px;     /* sticky header */\n  --radius:        4px;      /* the single corner radius */\n\n  /* ── Backward-compat aliases ── */\n  --border-radius: var(--radius);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Base resets + element defaults\n   Mirrors the live DHK site global.css so specimens and UI kits\n   render identically when they link styles.css.\n   ============================================================ */\n\n/* ── Resets ── */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { font-size: 16px; -webkit-font-smoothing: antialiased; }\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-sans);\n  line-height: var(--lh-snug);\n  min-height: 100vh;\n}\nimg { max-width: 100%; display: block; }\n\n/* ── Links: default to Electric Cobalt, hover darkens ── */\na { color: var(--accent); text-decoration: none; transition: color 0.15s; }\na:hover { color: var(--accent-hover); }\n\n/* ── Headings ── */\nh1, h2, h3 {\n  font-family: var(--font-sans);\n  color: var(--text);\n  line-height: var(--lh-tight);\n}\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-bold); letter-spacing: var(--ls-h1); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-semi); letter-spacing: var(--ls-h2); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-semi); }\n\n/* ── Body copy ── */\np { color: var(--text-muted); font-weight: var(--fw-body); line-height: var(--lh-body); }\n\n/* ── Layout wrapper ── */\n.container {\n  max-width: var(--max-width);\n  margin: 0 auto;\n  padding: 0 var(--sp5);\n}\n\n/* ── Metadata / dates helper ── */\n.meta {\n  font-family: var(--font-mono);\n  font-size: var(--fs-meta);\n  color: var(--text-dim);\n  letter-spacing: var(--ls-meta);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   DHK Design System — global entry point\n   Electric Cobalt palette · light theme · May 2026\n   Consumers link this ONE file. It only @imports.\n   ============================================================ */\n/* ============================================================\n   Fonts\n   The DHK site uses the native system-ui stack for all headings\n   and body prose, and DM Mono (Google Fonts) for UI chrome only.\n   ============================================================ */\n/* latin-ext */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: italic;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"81cd53aa-7fd6-4497-aa01-c30aaa29d1f2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00 329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"30f4e417-0d19-45aa-8238-a569415ef51b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"02395bce-a391-4720-a95a-b11d00e74836\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"3e1788c1-d536-4f8b-8af4-3d9085e6a83e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"93493536-0f6e-4aa2-894b-19ef1197e219\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Color tokens — Electric Cobalt palette (light theme, no dark mode)\n   Rule: never hardcode hex in components — always reference a token.\n   Rule: --text-muted must always be visually lighter than --text.\n   ============================================================ */\n:root {\n  /* ── Backgrounds ── */\n  --bg:  #f5f6fa;   /* page background — near-white blue-grey */\n  --bg2: #eceef5;   /* elevated surfaces, input & code backgrounds */\n  --bg3: #e0e3f0;   /* card hover state, inline code bg */\n\n  /* ── Borders ── */\n  --border:       #c8cde0;   /* default borders, dividers */\n  --border-light: #d8dbeb;   /* subtle borders, grid lines */\n\n  /* ── Text ── */\n  --text:       #0d0f1a;   /* headings, strong — darkest */\n  --text-muted: #2a2d42;   /* body copy, descriptions — lighter than --text */\n  --text-dim:   #5a5d78;   /* metadata, dates, labels, inactive nav */\n\n  /* ── Accent (primary) ── */\n  --accent:       #2b50e8;   /* Electric Cobalt — brand, CTA, active nav, links */\n  --accent-hover: #1a3bd4;   /* hover state for accent elements */\n\n  /* ── Accents (secondary) — content-type semantics ── */\n  --accent-purple: #8b2adc;  /* commentary & tool tags, graph/network work */\n  --accent-orange: #e05c2a;  /* trend/time-series, project tags */\n  --accent-teal:   #0ea5b0;  /* data viz, study tags */\n\n  /* ── Data-visualization palette (six-country multi-series) ── */\n  --viz-us: #2b50e8;   /* United States — cobalt (= --accent) */\n  --viz-se: #e8a030;   /* Sweden        — amber  */\n  --viz-gb: #d94040;   /* United Kingdom— red    */\n  --viz-fr: #0ea58a;   /* France        — teal   */\n  --viz-jp: #9b42d8;   /* Japan         — purple */\n  --viz-in: #c47830;   /* India         — sienna */\n\n  /* ── Tag tint backgrounds (10–12% alpha of the semantic accent) ── */\n  --tint-essay:      rgba(43, 80, 232, 0.10);\n  --tint-commentary: rgba(139, 42, 220, 0.10);\n  --tint-tool:       rgba(139, 42, 220, 0.10);\n  --tint-study:      rgba(14, 165, 176, 0.12);\n  --tint-project:    rgba(224, 92, 42, 0.10);\n\n  /* ── Backward-compat aliases (present but do not use in new code) ── */\n  --accent-blue: var(--accent-teal);\n  --text-head:   var(--text);\n}\n\n/* ============================================================\n   Typography tokens\n   No serif. No custom heading font. DM Mono is reserved for UI\n   chrome (tags, dates, nav, code) — never body prose.\n   Body font-weight minimum 400. No UI text below 11px.\n   ============================================================ */\n:root {\n  /* ── Families ── */\n  --font-sans: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono: \"DM Mono\", monospace;\n  --font-cond: var(--font-sans);   /* alias — condensed removed */\n\n  /* ── Font sizes ── */\n  --fs-h1:   clamp(42px, 5vw, 64px); /* @kind font */\n  --fs-h2:   28px;\n  --fs-h3:   20px;\n  --fs-body: 16px;   /* base */\n  --fs-lead: 17px;   /* post excerpts, lead paragraphs */\n  --fs-sm:   14px;   /* dense card copy */\n  --fs-meta: 12px;   /* mono metadata / dates */\n  --fs-tag:  11px;   /* mono tags, nav links (min UI size) */\n\n  /* ── Weights ── */\n  --fw-body:    400; /* @kind font */\n  --fw-medium:  500; /* @kind font */\n  --fw-semi:    600; /* @kind font */\n  --fw-bold:    700; /* @kind font */\n\n  /* ── Line heights ── */\n  --lh-tight: 1.1;    /* @kind font */\n  --lh-snug:  1.6;    /* @kind font */\n  --lh-body:  1.75;   /* @kind font */\n\n  /* ── Letter spacing ── */\n  --ls-h1:   -0.02em;\n  --ls-h2:   -0.01em;\n  --ls-meta:  0.04em;\n  --ls-tag:   0.08em;\n  --ls-nav:   0.1em;\n}\n\n/* ============================================================\n   Spacing scale\n   Use flex/grid with `gap` for all UI spacing — never margin\n   between sibling components.\n   ============================================================ */\n:root {\n  --sp1:  4px;\n  --sp2:  8px;\n  --sp3:  12px;\n  --sp4:  16px;\n  --sp5:  24px;\n  --sp6:  32px;\n  --sp7:  48px;\n  --sp8:  64px;\n  --sp9:  80px;\n  --sp10: 96px;\n  --sp11: 128px;\n\n  /* ── Backward-compat aliases ── */\n  --space-1: var(--sp1);\n  --space-2: var(--sp2);\n  --space-3: var(--sp3);\n  --space-4: var(--sp4);\n  --space-5: var(--sp5);\n  --space-6: var(--sp6);\n  --space-7: var(--sp7);\n  --space-8: var(--sp8);\n  --space-9: var(--sp9);\n  --space-10: var(--sp10);\n}\n\n/* ============================================================\n   Layout tokens\n   ============================================================ */\n:root {\n  --max-width:     1200px;   /* .container cap */\n  --prose-width:   680px;    /* long-form body cap */\n  --header-height: 56px;     /* sticky header */\n  --radius:        4px;      /* the single corner radius */\n\n  /* ── Backward-compat aliases ── */\n  --border-radius: var(--radius);\n}\n\n/* ============================================================\n   Base resets + element defaults\n   Mirrors the live DHK site global.css so specimens and UI kits\n   render identically when they link styles.css.\n   ============================================================ */\n\n/* ── Resets ── */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml { font-size: 16px; -webkit-font-smoothing: antialiased; }\nbody {\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-sans);\n  line-height: var(--lh-snug);\n  min-height: 100vh;\n}\nimg { max-width: 100%; display: block; }\n\n/* ── Links: default to Electric Cobalt, hover darkens ── */\na { color: var(--accent); text-decoration: none; transition: color 0.15s; }\na:hover { color: var(--accent-hover); }\n\n/* ── Headings ── */\nh1, h2, h3 {\n  font-family: var(--font-sans);\n  color: var(--text);\n  line-height: var(--lh-tight);\n}\nh1 { font-size: var(--fs-h1); font-weight: var(--fw-bold); letter-spacing: var(--ls-h1); }\nh2 { font-size: var(--fs-h2); font-weight: var(--fw-semi); letter-spacing: var(--ls-h2); }\nh3 { font-size: var(--fs-h3); font-weight: var(--fw-semi); }\n\n/* ── Body copy ── */\np { color: var(--text-muted); font-weight: var(--fw-body); line-height: var(--lh-body); }\n\n/* ── Layout wrapper ── */\n.container {\n  max-width: var(--max-width);\n  margin: 0 auto;\n  padding: 0 var(--sp5);\n}\n\n/* ── Metadata / dates helper ── */\n.meta {\n  font-family: var(--font-mono);\n  font-size: var(--fs-meta);\n  color: var(--text-dim);\n  letter-spacing: var(--ls-meta);\n}\n\n<\u002Fstyle>\n<script src=\"4db3670e-9267-45fd-af28-d4d5dc101b8c\"><\u002Fscript>\n<style>\n  body { background: var(--bg); }\n  a { color: var(--accent); }\n  a:hover { color: var(--accent-hover); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width: 980px; margin: 0 auto; padding: 72px 24px 120px; font-family: var(--font-sans); color: var(--text);\">\n\n  <div style=\"font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--accent); margin-bottom: 20px;\">Wingman / spec / interview<\u002Fdiv>\n\n  <div style=\"display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 24px;\">\n    <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.Tag\" kind=\"essay\" hint-size=\"70px,24px\">UX-0001<\u002Fx-import>\n    <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.Tag\" kind=\"tool\" hint-size=\"80px,24px\">UX SPEC<\u002Fx-import>\n    <span style=\"font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--text-dim);\">Status {{ statusLine }} · answers dhk/wingman#191 · reads against INTERVIEW-CLI-BRIEF.md<\u002Fspan>\n  <\u002Fdiv>\n\n  <h1 style=\"font-size: clamp(40px, 5vw, 60px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; max-width: 820px;\">Perspectives, asked properly<\u002Fh1>\n\n  <p style=\"font-size: 19px; line-height: 1.6; color: var(--text-muted); max-width: 700px; margin-top: 24px;\">A designed interaction for wingman's interview capture, run from inside Claude Code or Claude Desktop. Every section opens with a short explainer; every question is asked through the client's own structured-question UI. The surface being designed is the conversation — the artifact is a tool contract and a set of docstrings, not a terminal framework.<\u002Fp>\n\n  <div style=\"display: flex; gap: 32px; flex-wrap: wrap; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);\">\n    <div><div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);\">Surface<\u002Fdiv><div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">MCP client chat<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);\">Control<\u002Fdiv><div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">AskUserQuestion<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);\">Enforcement<\u002Fdiv><div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">Tool return + docstring<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);\">Scope<\u002Fdiv><div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">Tier 1 now · Tier 2 shape<\u002Fdiv><\u002Fdiv>\n    <div><div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);\">Revision<\u002Fdiv><div style=\"font-size: 15px; color: var(--text-muted); margin-top: 6px;\">{{ revisionLine }}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 01 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">01 — Goals &amp; non-goals<\u002Fx-import>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px;\">\n    <div>\n      <h3 style=\"font-size: 20px; font-weight: 600; margin-bottom: 20px;\">Goals<\u002Fh3>\n      <ul style=\"list-style: none; display: flex; flex-direction: column; gap: 14px;\">\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-muted);\"><span style=\"color: var(--accent); font-family: var(--font-mono);\">→<\u002Fspan> Someone with no published writing can produce an evidence-backed stance in one sitting, without composing prose.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-muted);\"><span style=\"color: var(--accent); font-family: var(--font-mono);\">→<\u002Fspan> Every question arrives as a clickable structured question with a free-text escape — never a bare chat turn the user must decode.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-muted);\"><span style=\"color: var(--accent); font-family: var(--font-mono);\">→<\u002Fspan> The \"why\" stays verbatim, in the user's own voice, never narrowed toward a menu.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-muted);\"><span style=\"color: var(--accent); font-family: var(--font-mono);\">→<\u002Fspan> The con-then-pro / ask-second-first ordering survives, and is <em>visible<\u002Fem> as a deliberate device.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-muted);\"><span style=\"color: var(--accent); font-family: var(--font-mono);\">→<\u002Fspan> Behaviour is consistent across Claude Code, Claude Desktop, and any MCP client — because it is carried in the tool's return, not the model's memory.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <h3 style=\"font-size: 20px; font-weight: 600; margin-bottom: 20px;\">Non-goals <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); font-weight: 400;\">(this pass)<\u002Fspan><\u002Fh3>\n      <ul style=\"list-style: none; display: flex; flex-direction: column; gap: 14px;\">\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-dim);\"><span style=\"font-family: var(--font-mono);\">×<\u002Fspan> No bespoke terminal-rendering framework. <span style=\"font-family: var(--font-mono); font-size: 13px;\">wingman interview<\u002Fspan> stays a scriptable primitive underneath.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-dim);\"><span style=\"font-family: var(--font-mono);\">×<\u002Fspan> No stateful server-side wizard. The tool answers \"what's next\", it does not own a session.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-dim);\"><span style=\"font-family: var(--font-mono);\">×<\u002Fspan> No accounts, no sync, no remote state — local-first, single user.<\u002Fli>\n        <li style=\"display: flex; gap: 12px; font-size: 15px; line-height: 1.6; color: var(--text-dim);\"><span style=\"font-family: var(--font-mono);\">×<\u002Fspan> Company-alignment (v2) is named but not designed against.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 02 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">02 — Best practices for an assistant-asked surface<\u002Fx-import>\n\n  <p style=\"font-size: 16px; line-height: 1.75; color: var(--text-muted); max-width: 700px; margin-bottom: 8px;\">This surface is unusual: the interface is rendered by a client we don't control, driven by a model we don't control, from a contract we do. There is no layout to art-direct. The design lives in <strong style=\"color: var(--text);\">what gets asked, in what order, with what exits<\u002Fstrong>. Ten rules, proposed here as the house standard for any wingman flow driven this way.<\u002Fp>\n  <p style=\"font-size: 13px; line-height: 1.6; color: var(--text-dim); max-width: 700px; margin-bottom: 28px; font-style: italic;\">BP-01 and BP-02 restate the product owner's two settled requirements. BP-03…10 are this spec's proposals.<\u002Fp>\n\n  <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; overflow: hidden;\">\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 10px;\">BP-01<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Explain, then ask<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Every section opens with two or three sentences: what this is, why it's being asked, what's coming. No question arrives cold. A clickable option is only as good as the frame around it.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 10px;\">BP-02<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">One decision per card<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Each structured question asks exactly one thing. Bundling \"who, and why\" into one turn makes the user hold two decisions to answer either, and the free-text half always suffers.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-03<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Options for structure, prose for substance<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Presets are correct for agree/disagree, which-module-next, continue-or-stop. They are <strong style=\"color: var(--text);\">never<\u002Fstrong> correct for a field that becomes evidence. A menu shapes the answer — fatal when the answer <em>is<\u002Fem> the data.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-04<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Every card has an exit<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Free text, \"skip this one\", and \"I'm done for now\" are always reachable — as options, not as instructions to type something. A user who can't leave a question will leave the session.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-05<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Say where you are, and what it costs<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Position and budget belong in the explainer, not in an error at the ceiling: \"Con 2 of 3 · you've used 4 of 6 slots for this category.\" Chat has no persistent chrome — the sentence <em>is<\u002Fem> the progress bar.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-06<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Echo verbatim before you commit<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Show the exact string that will be stored, in a quote block, and save on confirm. A model paraphrasing a user's words into a tool call is the single largest risk to evidence discipline on this path.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-07<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Name the reason for an odd order<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Con before pro, and the second nominee before the first, are anti-bias devices. Said once per section they read as craft; unsaid they read as a bug, and the next maintainer \"fixes\" them.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-08<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Empty is a valid answer<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">One anchor-first re-ask, then a clean stop naming the command that would produce a stance later. Never a third attempt. Coerced answers are worse than no answers — they become evidence.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-09<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Suggest, never gate<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">The trust ladder is an ordering of options in one card, with the recommended next step first — not a locked sequence. No option is ever disabled; nothing is a prerequisite for anything.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background: var(--bg); padding: 22px;\">\n      <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--accent-purple); margin-bottom: 10px;\">BP-10<\u002Fdiv>\n      <div style=\"font-size: 16px; font-weight: 600; margin-bottom: 8px;\">Protocol travels in the return value<\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Each call returns the next explainer and the next question's shape. Docstrings tell the assistant <em>how<\u002Fem> to render; the payload tells it <em>what<\u002Fem>. Prose-only protocol drifts across models, clients, and context lengths.<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- 03 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">03 — Anatomy of a capture<\u002Fx-import>\n\n  <p style=\"font-size: 16px; line-height: 1.75; color: var(--text-muted); max-width: 700px; margin-bottom: 28px;\">Every capture in every category is the same four-beat loop. The beats never merge — in particular, <strong style=\"color: var(--text);\">reaction and reasoning are separate cards<\u002Fstrong>, because reasoning is the only beat that produces evidence.<\u002Fp>\n\n  <div style=\"background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 20px;\">\n    <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 16px;\">Loop · four beats, one capture<\u002Fdiv>\n    <div style=\"display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap;\">\n      <div style=\"flex: 1; min-width: 150px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 14px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);\">Beat 1 · explainer<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--text); margin-top: 8px; font-weight: 500;\">Plain prose<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-dim); margin-top: 4px;\">What, why, what's next, where you are. Not a question.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1; min-width: 150px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 14px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);\">Beat 2 · stimulus<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--text); margin-top: 8px; font-weight: 500;\">Free text card<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-dim); margin-top: 4px;\">URL, file, or a name. Options only for recall aids and \"skip\".<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1; min-width: 150px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 14px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);\">Beat 3 · reaction<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--text); margin-top: 8px; font-weight: 500;\">Options card<\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-dim); margin-top: 4px;\">The one genuinely structural choice. Maps 1:1 to a subtype.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1; min-width: 150px; border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); padding: 14px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);\">Beat 4 · reasoning<\u002Fdiv>\n        <div style=\"font-size: 14px; color: var(--text); margin-top: 8px; font-weight: 500;\">Free text only — <span style=\"color: var(--accent);\">evidence<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size: 13px; color: var(--text-dim); margin-top: 4px;\">Stored verbatim. No presets, ever. Echoed back before save.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size: 13px; line-height: 1.65; color: var(--text-dim); margin-top: 14px; font-style: italic;\">Mission alignment inserts a fifth beat between 3 and 4 — \"what do you understand this organisation's purpose to be\" — captured as <strong style=\"color: var(--text-muted);\">context<\u002Fstrong>, rendered in the muted context style, never in the evidence style.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- 04 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">04 — Entry: perspectives_start<\u002Fx-import>\n\n  <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted); max-width: 700px; margin-bottom: 20px;\">The trust ladder as a single card. Recommended next step first; resume first when prior captures exist. No option disabled, no tier locked (BP-09).<\u002Fp>\n\n  <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg3);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);\">Transcript wireframe · Claude Desktop<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);\">tool: perspectives_start<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border-light);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); min-width: 56px; padding-top: 3px;\">You<\u002Fspan>\n      <div style=\"font-size: 14px; line-height: 1.7; color: var(--text);\">I don't really publish anything. Can wingman still figure out what I think?<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border-light);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); min-width: 56px; padding-top: 3px;\">Claude<\u002Fspan>\n      <div style=\"font-size: 14px; line-height: 1.7; color: var(--text-muted);\">Yes — Perspectives builds the same evidence base by having you react to things rather than write. You react, you say why, and only your own words are ever stored as evidence. Three ways in; you can do any of them, in any order, as many times as you like, and stop whenever.<br><span style=\"color: var(--text-dim);\">Nothing is saved until you confirm it.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 16px;\">\n      <div style=\"border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); overflow: hidden;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; background: var(--tint-essay); border-bottom: 1px solid var(--border-light);\">\n          <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);\">AskUserQuestion · single select<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);\">header: Start<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 16px;\">\n          <div style=\"font-size: 15px; color: var(--text); margin-bottom: 14px;\">Where would you like to start?<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--accent); border-radius: 4px; padding: 10px 12px; background: var(--tint-essay);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">●<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text); font-weight: 500;\">React to things I've read<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Suggested first step · 2–3 you agree with, 2–3 you don't · ~10 min<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">Name people<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Three you'd have dinner with, three you'd hate to be listed beside · ~8 min<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">Name organisations<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Places you'd want — or refuse — to be associated with · ~8 min<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">I do have writing to add<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Skip the interview — use the corpus path instead<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--border); border-radius: 4px; padding: 10px 12px; background: var(--bg);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">✎<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text-muted);\">Other<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Free text — always present, always last<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showRationale }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"border-left: 3px solid var(--accent); background: var(--bg2); border-radius: 0 4px 4px 0; padding: 14px 18px; margin-top: 16px;\">\n    <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\"><strong style=\"color: var(--text);\">Why a card and not a numbered menu:<\u002Fstrong> a menu in prose has to be read, parsed, and replied to with a number the user then has to trust the model to interpret. A card is one click and the answer arrives structured. The tier ordering is preserved as <em>option order<\u002Fem> plus one \"suggested first step\" label — which is exactly as much gating as the ladder deserves.<\u002Fp>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- 05 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">05 — Tier 1: alignment of perspective<\u002Fx-import>\n\n  <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted); max-width: 700px; margin-bottom: 20px;\">The smallest complete loop, and the recommended first build (<span style=\"font-family: var(--font-mono); font-size: 13px;\">interview_react<\u002Fspan> with subtypes <span style=\"font-family: var(--font-mono); font-size: 13px;\">alignment_of_perspective_agree<\u002Fspan> / <span style=\"font-family: var(--font-mono); font-size: 13px;\">…_disagree<\u002Fspan>).<\u002Fp>\n\n  <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg3);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);\">Transcript wireframe · one full capture<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);\">tool: interview_react<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border-light);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); min-width: 56px; padding-top: 3px;\">Claude<\u002Fspan>\n      <div style=\"font-size: 14px; line-height: 1.7; color: var(--text-muted);\"><strong style=\"color: var(--text);\">Alignment of perspective.<\u002Fstrong> You point me at something you've read — a link, or a file on your machine — and tell me whether you agree with it and why. Your \"why\" is the only part that gets stored; the article itself is just context, and I'll never quote it back as though it were your view.<br><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">Capture 1 · aiming for 2–3 agree and 2–3 disagree · stop any time.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 16px 16px 0;\">\n      <div style=\"border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); overflow: hidden;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; background: var(--tint-essay); border-bottom: 1px solid var(--border-light);\">\n          <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);\">AskUserQuestion · free text primary<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);\">header: Source<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 16px;\">\n          <div style=\"font-size: 15px; color: var(--text); margin-bottom: 6px;\">What have you read that you have an opinion about?<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--text-dim); margin-bottom: 14px;\">Paste a link, or the path to a PDF, Word doc or Markdown file.<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px dashed var(--accent); border-radius: 4px; padding: 10px 12px; background: var(--tint-essay);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--accent);\">✎<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text); font-weight: 500;\">Other — paste a URL or path<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">The real input. Options below exist only to unstick recall.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">Nothing comes to mind<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Anchor re-ask: the last thing you sent someone, or argued with<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">I'm done for now<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Clean stop · always the last non-free-text option<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border-light);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); min-width: 56px; padding-top: 3px;\">You<\u002Fspan>\n      <div style=\"font-size: 14px; line-height: 1.7; color: var(--text); font-family: var(--font-mono); font-size: 13px;\">https://example.org/the-case-against-dashboards<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 0 16px 16px;\">\n      <div style=\"border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 16px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; background: var(--tint-essay); border-bottom: 1px solid var(--border-light);\">\n          <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);\">AskUserQuestion · single select<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);\">header: Reaction<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 16px;\">\n          <div style=\"font-size: 15px; color: var(--text); margin-bottom: 6px;\">\"The case against dashboards\" — where do you land?<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--text-dim); margin-bottom: 14px;\">Title read from the page for provenance only. Nothing stored yet.<\u002Fdiv>\n          <div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">\n            <span style=\"font-family: var(--font-mono); font-size: 12px; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--accent); background: var(--tint-essay); color: var(--accent);\">Agree<\u002Fspan>\n            <span style=\"font-family: var(--font-mono); font-size: 12px; padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border-light); background: var(--bg2); color: var(--text-muted);\">Disagree<\u002Fspan>\n            <span style=\"font-family: var(--font-mono); font-size: 12px; padding: 8px 16px; border-radius: 4px; border: 1px dashed var(--border); background: var(--bg); color: var(--text-dim);\">Other — it's complicated<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 12px; line-height: 1.6; color: var(--text-dim); margin-top: 12px; font-style: italic;\">\"It's complicated\" routes to the disagree subtype and leans on the \"why\" to carry the nuance — it does not invent a third subtype.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); overflow: hidden; margin-top: 12px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; background: var(--tint-essay); border-bottom: 1px solid var(--border-light);\">\n          <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);\">AskUserQuestion · free text only<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--accent);\">evidence field<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 16px;\">\n          <div style=\"font-size: 15px; color: var(--text); margin-bottom: 6px;\">Why? In your own words.<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--text-dim); margin-bottom: 14px;\">This sentence is the evidence. It gets stored exactly as you write it — so write it how you'd say it, not how you'd publish it. A line or two is plenty.<\u002Fdiv>\n          <div style=\"border: 1px dashed var(--accent); border-radius: 4px; padding: 14px; background: var(--tint-essay); min-height: 64px; font-size: 14px; color: var(--text-dim); font-style: italic;\">Free text. No options offered — not even examples, which anchor the answer.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 16px; margin-top: 12px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px;\">Echo before save · BP-06<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.7; color: var(--text-muted);\">Saving this as your own words, verbatim:<\u002Fdiv>\n        <div style=\"border-left: 3px solid var(--accent); background: var(--bg2); border-radius: 0 4px 4px 0; padding: 12px 16px; margin-top: 10px; font-size: 14px; line-height: 1.7; color: var(--text-muted); font-style: italic;\">\"Dashboards answer questions nobody asked. The teams I've seen do well replaced them with three numbers and someone accountable for each.\"<\u002Fdiv>\n        <div style=\"display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);\">\n          <span>subtype <span style=\"color: var(--text-muted);\">alignment_of_perspective_agree<\u002Fspan><\u002Fspan>\n          <span>context <span style=\"color: var(--text-muted);\">example.org · sha256 …4f19<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;\">\n          <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.Button\" variant=\"primary\" hint-size=\"120px,34px\">Save it<\u002Fx-import>\n          <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.Button\" variant=\"ghost\" hint-size=\"120px,34px\">Let me reword<\u002Fx-import>\n          <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.Button\" variant=\"ghost\" hint-size=\"110px,34px\">Discard<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: 14px; padding: 16px 0 0;\">\n        <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); min-width: 56px; padding-top: 3px;\">Claude<\u002Fspan>\n        <div style=\"font-size: 14px; line-height: 1.7; color: var(--text-muted);\">Saved. That's <strong style=\"color: var(--text);\">1 agree, 0 disagree<\u002Fstrong> — the disagrees are the ones that actually discriminate, so they're worth the effort.<br><span style=\"color: var(--text-dim);\">Next: something you disagreed with?<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 06 -->\n  <x-import component-from-global-scope=\"DHKDesignSystem_c5bcb5.SectionDivider\" hint-size=\"100%,80px\">06 — Tier 2: the ordered categories<\u002Fx-import>\n\n  <p style=\"font-size: 15px; line-height: 1.7; color: var(--text-muted); max-width: 700px; margin-bottom: 24px;\">Values and Mission alignment reuse the same loop with an ordering discipline on top: <strong style=\"color: var(--text);\">con block before pro block<\u002Fstrong>, and <strong style=\"color: var(--text);\">within each block, nominee #2 is asked about before #1<\u002Fstrong>. The order is stated once, in the section explainer, and then simply followed.<\u002Fp>\n\n  <div style=\"background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 28px;\">\n    <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px;\">Sequence · Values<\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap;\">\n      <span style=\"font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; border-radius: 4px; background: var(--tint-project); border: 1px solid var(--accent-orange); color: var(--accent-orange);\">Name 3 con<\u002Fspan>\n      <span style=\"color: var(--text-dim); font-family: var(--font-mono);\">→<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);\">why · #2<\u002Fspan>\n      <span style=\"color: var(--text-dim); font-family: var(--font-mono);\">→<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);\">why · #1<\u002Fspan>\n      <span style=\"color: var(--text-dim); font-family: var(--font-mono);\">→<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);\">why · #3<\u002Fspan>\n      <span style=\"color: var(--text-dim); font-family: var(--font-mono);\">→<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; border-radius: 4px; background: var(--tint-study); border: 1px solid var(--accent-teal); color: var(--accent-teal);\">Name 3 pro<\u002Fspan>\n      <span style=\"color: var(--text-dim); font-family: var(--font-mono);\">→<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);\">why · #2, #1, #3<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size: 13px; line-height: 1.65; color: var(--text-dim); margin-top: 14px;\">Ends on the pro block — the section closes warm. The naming card collects all three at once (multi-select is wrong here; it's three free-text slots in one card, or three quick cards — implementer's call, but never a preset list of people).<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg2); overflow: hidden;\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg3);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);\">Transcript wireframe · Values, section open<\u002Fspan>\n      <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);\">subtypes: values_con → values_pro<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border-light);\">\n      <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); min-width: 56px; padding-top: 3px;\">Claude<\u002Fspan>\n      <div style=\"font-size: 14px; line-height: 1.7; color: var(--text-muted);\"><strong style=\"color: var(--text);\">Values.<\u002Fstrong> I'll ask for three people you'd be uncomfortable being named alongside first, then three you'd genuinely want dinner with — and for each one, why, in your words. Doing the difficult list first is deliberate: it keeps the easy list honest, and it means we finish on the people you admire.<br><span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">You've used 2 of 6 slots in this category. Public figures, colleagues, anyone — you can also switch to organisations if naming people feels wrong.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 16px;\">\n      <div style=\"border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); overflow: hidden;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 14px; background: var(--tint-essay); border-bottom: 1px solid var(--border-light);\">\n          <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);\">AskUserQuestion · free text ×3<\u002Fspan>\n          <span style=\"font-family: var(--font-mono); font-size: 10px; color: var(--accent-orange);\">values_con<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 16px;\">\n          <div style=\"font-size: 15px; color: var(--text); margin-bottom: 6px;\">Name up to three people you'd be uncomfortable being listed alongside.<\u002Fdiv>\n          <div style=\"font-size: 13px; color: var(--text-dim); margin-bottom: 14px;\">One or two is fine. Names only for now — I'll ask why afterwards, one at a time.<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <div style=\"border: 1px dashed var(--accent); border-radius: 4px; padding: 11px 12px; background: var(--tint-essay); font-size: 13px; color: var(--text-dim); font-family: var(--font-mono);\">1 ·<\u002Fdiv>\n            <div style=\"border: 1px dashed var(--accent); border-radius: 4px; padding: 11px 12px; background: var(--tint-essay); font-size: 13px; color: var(--text-dim); font-family: var(--font-mono);\">2 ·<\u002Fdiv>\n            <div style=\"border: 1px dashed var(--accent); border-radius: 4px; padding: 11px 12px; background: var(--tint-essay); font-size: 13px; color: var(--text-dim); font-family: var(--font-mono);\">3 ·<\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2); margin-top: 4px;\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">I'd rather name companies<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Switches to <span style=\"font-family: var(--font-mono);\">values_fallback_con<\u002Fspan> — \"never buy from\" instead of \"named alongside\"<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border-light); border-radius: 4px; padding: 10px 12px; background: var(--bg2);\">\n              <span style=\"font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);\">○<\u002Fspan>\n              <div><div style=\"font-size: 14px; color: var(--text);\">Skip the con list<\u002Fdiv><div style=\"font-size: 12px; color: var(--text-dim); margin-top: 3px;\">Goes straight to the pro block · nothing is required<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;\">\n        <div style=\"border: 1px solid var(--accent-orange); border-radius: 4px; background: var(--bg); padding: 16px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-orange); margin-bottom: 10px;\">Guardrail · values_con only<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">Hitler is rejected by the capture layer here, and only here. Copy: <em>\"That one's excluded — it's too easy a name to tell me anything about your values. Someone closer to your own world?\"<\u002Fem> — a re-ask, not an error. The exclusion must not be repeated in the org or company-fallback cards.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--accent-purple); border-radius: 4px; background: var(--bg); padding: 16px;\">\n          <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-purple); margin-bottom: 10px;\">Mission alignment · the fifth beat<\u002Fdiv>\n          <p style=\"font-size: 14px; line-height: 1.65; color: var(--text-muted);\">\"What do you understand this organisation's purpose to be?\" is asked <em>before<\u002Fem> the why, and echoed under a <strong style=\"color: var(--text);\">Context<\u002Fstrong> label — never inside the evidence quote block. Two visually distinct treatments, one screen apart, so the boundary is never ambiguous.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 16px; margin-top: 12px;\">\n        <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px;\">Honest degrade · after the anchor re-ask<\u002Fdiv>\n        <div style=\"font-size: 14px; line-height: 1.7; color: var(--text-muted);\">\"Nothing's coming — that's a real answer, not a failure. Nothing was saved for this section. When an organisation does come to mind, <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--text);\">wingman interview mission_alignment_pro …<\u002Fspan> or just tell me here.\"<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\
